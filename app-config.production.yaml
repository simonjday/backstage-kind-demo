app:
  baseUrl: http://localhost:8080

backend:
  baseUrl: http://localhost:8080
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:8080
  reading:
    allow:
      - host: raw.githubusercontent.com
      - host: github.com
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: development
  providers:
    guest:
      # guest auth is blocked outside NODE_ENV=development by default —
      # our Dockerfile sets NODE_ENV=production, so this override is required
      # for a test/demo instance. Never do this for anything real.
      dangerouslyAllowOutsideDevelopment: true

catalog:
  rules:
    # Default Backstage rules exclude Template kind from url-type locations
    # (templates execute scaffolder actions, so it's treated as more sensitive
    # than a plain Component). This override adds it back for the demo.
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    - type: url
      target: https://github.com/simonjday/agentgateway-demo/blob/main/catalog-info.yaml
      # swap/remove for whichever repo you want registered — or point at the
      # namespace-onboarding-api repo to test the scaffolder template end to end
