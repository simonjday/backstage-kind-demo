apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: namespace-onboarding
  title: Request a Namespace
  description: Self-service OpenShift namespace creation and access onboarding
spec:
  type: infrastructure
  parameters:
    - title: Basics
      required: [project_name, environment, cost_center, oncall_group]
      properties:
        project_name:
          type: string
          pattern: '^[a-z0-9-]{3,40}$'
          description: Lowercase, hyphenated — becomes the namespace name
        environment:
          type: string
          enum: [dev, staging, prod]
        cost_center:
          type: string
          enum: [CC-1001, CC-1002]   # pulled from finance lookup at render time
        oncall_group:
          type: string
          description: PagerDuty/AlertManager routing group
        target_cluster:
          type: string
          enum: [kind-devops-lab, ocp-prod-1]

    - title: Sizing & Network
      required: [resource_profile, network_zone]
      properties:
        resource_profile:
          type: string
          enum: [small, medium, large]
          enumNames:
            - "Small — 250m/256Mi req, 10 pods"
            - "Medium — 1 CPU/1Gi req, 30 pods"
            - "Large — 4 CPU/8Gi req, 100 pods"
        network_zone:
          type: string
          enum: [internal, dmz, restricted]

    - title: Security & Compliance
      required: [scc_requirement, data_classification]
      properties:
        scc_requirement:
          type: string
          enum: [restricted, restricted-v2, nonroot, anyuid]
          description: Anything above restricted-v2 triggers security approval
        data_classification:
          type: string
          enum: [public, internal, confidential]
          description: confidential triggers data-governance approval

    - title: Lifecycle
      properties:
        expiry_date:
          type: string
          format: date
          description: Leave blank for permanent (staging/prod). Required for ephemeral dev.

  steps:
    - id: create-namespace
      name: Create namespace (pending approval)
      # Creates a real Namespace in the cluster Backstage itself is running
      # in, labelled pending-approval. It's inert until the "Approve
      # Namespace Request" template attaches quota/limits/network policy and
      # flips the label to approved.
      action: kubernetes:apply
      input:
        manifest: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${{ parameters.project_name }}
            labels:
              status: pending-approval
              environment: ${{ parameters.environment }}
              cost-center: ${{ parameters.cost_center }}
              managed-by: backstage-scaffolder
            annotations:
              requested-by: ${{ user.entity.metadata.name }}
              oncall-group: ${{ parameters.oncall_group }}
              resource-profile: ${{ parameters.resource_profile }}
              network-zone: ${{ parameters.network_zone }}
              scc-requirement: ${{ parameters.scc_requirement }}
              data-classification: ${{ parameters.data_classification }}
              target-cluster: ${{ parameters.target_cluster }}
              expiry-date: ${{ parameters.expiry_date }}

    - id: log
      name: Log request
      action: debug:log
      input:
        message: >-
          Namespace '${{ parameters.project_name }}' created with
          status=pending-approval by ${{ user.entity.metadata.name }}.
          Run the "Approve Namespace Request" template next to actually
          provision it (quota, limits, network policy) and flip it to approved.

  # To POST to a real endpoint instead (e.g. httpbin.org/post for a smoke
  # test, or the real onboarding API), install the Roadie HTTP action plugin:
  #   yarn --cwd packages/backend add @roadiehq/scaffolder-backend-module-http-request
  # then in packages/backend/src/index.ts:
  #   backend.add(import('@roadiehq/scaffolder-backend-module-http-request'));
  # and replace the step above with:
  #   action: http:backstage:request
  #   input:
  #     url: https://ns-api.internal/namespaces
  #     method: POST
  #     body: ${{ parameters }}
